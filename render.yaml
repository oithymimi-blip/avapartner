databases:
  - name: avapartner-db
    plan: free
    databaseName: avapartner
    user: avapartner

services:
  - type: web
    name: avapartner-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: avapartner-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://avapartner.app,https://www.avapartner.app,https://avapartner.up.railway.app,https://avapartner.vercel.app
