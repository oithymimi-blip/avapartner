<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#0C1E35" />
      <stop offset="100%" stop-color="#07111E" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DF9A" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-opacity="0.45" />
  <!-- Stylized Emblem & AP Monogram -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="210" letter-spacing="-6" fill="url(#brandGrad)" text-anchor="middle" dominant-baseline="middle">AP</text>
</svg>
