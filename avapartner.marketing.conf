server {
    server_name avapartner.marketing www.avapartner.marketing;

    root /var/www/exchanger/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/avapartner.marketing/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/avapartner.marketing/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.avapartner.marketing) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = avapartner.marketing) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name avapartner.marketing www.avapartner.marketing;
    return 404; # managed by Certbot
}
